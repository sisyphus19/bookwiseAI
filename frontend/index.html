<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookWise AI — Intelligent Distributed Recommendation Platform</title>
  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: {
            brand: { 50: '#f0f4ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
          }
        }
      }
    }
  </script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-input { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.12); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const API_BASE = "http://localhost:8000/api/v1";

    function App() {
      const [activeTab, setActiveTab] = React.useState('search');
      const [query, setQuery] = React.useState('Recommend philosophical sci-fi books like Dune');
      const [maxPages, setMaxPages] = React.useState(700);
      const [loading, setLoading] = React.useState(false);
      const [recommendations, setRecommendations] = React.useState(null);
      const [userProfile, setUserProfile] = React.useState({
        username: "DemoUser",
        favorite_genres: ["Sci-Fi", "Philosophy"],
        preferred_mood: "thought-provoking"
      });
      const [feedbackStatus, setFeedbackStatus] = React.useState({});

      // Initial Search on Load
      React.useEffect(() => {
        handleSearch();
      }, []);

      const handleSearch = async (customQuery) => {
        const q = customQuery || query;
        if (!q.trim()) return;
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/recommend`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: q,
              favorite_genres: userProfile.favorite_genres,
              preferred_mood: userProfile.preferred_mood,
              max_page_count: maxPages,
              top_k: 5
            })
          });
          const data = await res.json();
          setRecommendations(data);
        } catch (err) {
          console.error("Error fetching recommendations:", err);
        } finally {
          setLoading(false);
        }
      };

      const handleFeedback = async (bookId, rating, isHelpful) => {
        try {
          await fetch(`${API_BASE}/feedback`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              book_id: bookId,
              rating: rating,
              is_helpful: isHelpful,
              comment: "Submitted via Frontend UI"
            })
          });
          setFeedbackStatus(prev => ({ ...prev, [bookId]: rating }));
        } catch (err) {
          console.error("Feedback error:", err);
        }
      };

      const sampleQueries = [
        "Recommend philosophical sci-fi books like Dune",
        "I want emotionally heavy books under 300 pages",
        "Suggest fantasy books with political intrigue but less violence",
        "Recommend books similar to The Hobbit but darker"
      ];

      return (
        <div class="min-h-screen flex flex-col">
          {/* Header Bar */}
          <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('search')}>
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/20">
                📚
              </div>
              <div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-violet-300">BookWise AI</h1>
                <p class="text-xs text-slate-400">Distributed AI RAG Recommendation Engine</p>
              </div>
            </div>

            <nav class="flex items-center space-x-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
              <button 
                onClick={() => setActiveTab('search')}
                class={`px-4 py-2 rounded-lg font-medium text-sm transition-all ${activeTab === 'search' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                🔍 Recommendations
              </button>
              <button 
                onClick={() => setActiveTab('profile')}
                class={`px-4 py-2 rounded-lg font-medium text-sm transition-all ${activeTab === 'profile' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                👤 User Profile
              </button>
              <button 
                onClick={() => setActiveTab('analytics')}
                class={`px-4 py-2 rounded-lg font-medium text-sm transition-all ${activeTab === 'analytics' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                📊 Admin Metrics
              </button>
            </nav>
          </header>

          {/* Main Content Area */}
          <main class="flex-1 max-w-7xl w-full mx-auto p-6">
            {activeTab === 'search' && (
              <div class="space-y-8">
                {/* Search Header Banner */}
                <div class="glass-card rounded-2xl p-8 border border-slate-800 relative overflow-hidden">
                  <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                  <h2 class="text-3xl font-extrabold mb-2">What kind of book are you looking for?</h2>
                  <p class="text-slate-400 mb-6">Describe your desired themes, mood, or page length in plain English. Powered by RAG & LLM Reasoning.</p>

                  <div class="flex flex-col md:flex-row gap-3">
                    <input 
                      type="text" 
                      value={query}
                      onChange={(e) => setQuery(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleSearch()}
                      placeholder="e.g. Recommend philosophical sci-fi books like Dune..."
                      class="flex-1 glass-input px-5 py-4 rounded-xl text-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    <button 
                      onClick={() => handleSearch()}
                      disabled={loading}
                      class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold px-8 py-4 rounded-xl shadow-lg shadow-indigo-500/25 flex items-center justify-center space-x-2 transition-all">
                      {loading ? <span>Searching...</span> : <span>Get Recommendations 🚀</span>}
                    </button>
                  </div>

                  {/* Sample Query Chips */}
                  <div class="mt-4 flex flex-wrap items-center gap-2 text-xs">
                    <span class="text-slate-400">Try asking:</span>
                    {sampleQueries.map((sq, i) => (
                      <button 
                        key={i} 
                        onClick={() => { setQuery(sq); handleSearch(sq); }}
                        class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                        "{sq}"
                      </button>
                    ))}
                  </div>
                </div>

                {/* Results Section */}
                {recommendations && (
                  <div class="space-y-6">
                    <div class="flex items-center justify-between">
                      <h3 class="text-xl font-bold flex items-center space-x-2">
                        <span>Top Recommendations</span>
                        <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-full font-medium">
                          {recommendations.total_candidates_retrieved} candidates analyzed ({recommendations.execution_time_ms} ms)
                        </span>
                      </h3>
                      {recommendations.llm_fallback_used && (
                        <span class="text-xs bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full border border-amber-500/30">
                          ⚡ Fast Rule Fallback Active
                        </span>
                      )}
                    </div>

                    <div class="grid grid-cols-1 gap-6">
                      {recommendations.recommendations.map((rec, idx) => (
                        <div key={rec.book.id} class="glass-card rounded-2xl p-6 border border-slate-800 hover:border-indigo-500/30 transition flex flex-col md:flex-row gap-6">
                          {/* Book Cover */}
                          <div class="w-full md:w-44 h-60 rounded-xl overflow-hidden bg-slate-800 flex-shrink-0 relative shadow-md">
                            <img 
                              src={rec.book.cover_image_url || "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400"} 
                              alt={rec.book.title}
                              class="w-full h-full object-cover"
                            />
                            <div class="absolute top-3 left-3 bg-slate-950/80 backdrop-blur text-amber-400 text-xs font-bold px-2 py-1 rounded-md border border-amber-500/20">
                              ★ {rec.book.rating.toFixed(1)}
                            </div>
                          </div>

                          {/* Content */}
                          <div class="flex-1 space-y-4">
                            <div class="flex items-start justify-between">
                              <div>
                                <span class="text-xs font-bold text-indigo-400 tracking-wider uppercase">Rank #{idx + 1}</span>
                                <h4 class="text-2xl font-bold text-white">{rec.book.title}</h4>
                                <p class="text-sm text-slate-400">by {rec.book.author} • {rec.book.publication_year} • {rec.book.page_count} pages</p>
                              </div>
                              <div class="text-right">
                                <div class="text-2xl font-extrabold text-emerald-400">{Math.round(rec.final_score * 100)}%</div>
                                <div class="text-xs text-slate-400">Match Score</div>
                              </div>
                            </div>

                            {/* Genres */}
                            <div class="flex flex-wrap gap-1.5">
                              {rec.book.genres.map((g, gi) => (
                                <span key={gi} class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-md">
                                  {g}
                                </span>
                              ))}
                            </div>

                            {/* Description */}
                            <p class="text-sm text-slate-300 line-clamp-2">{rec.book.description}</p>

                            {/* LLM Reasoning & Bullets */}
                            <div class="bg-slate-900/90 rounded-xl p-4 border border-indigo-500/20 space-y-2">
                              <div class="text-xs font-semibold text-indigo-300 flex items-center space-x-1">
                                <span>🧠 LLM Reasoning & Explainability:</span>
                              </div>
                              <p class="text-sm text-slate-200 italic">"{rec.llm_explanation}"</p>
                              
                              <div class="grid grid-cols-1 md:grid-cols-2 gap-2 pt-2 border-t border-slate-800">
                                {rec.reasoning_bullets.map((b, bi) => (
                                  <div key={bi} class="text-xs text-emerald-300 font-medium flex items-center space-x-1.5">
                                    <span>{b}</span>
                                  </div>
                                ))}
                              </div>
                            </div>

                            {/* Score Breakdown & Feedback */}
                            <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs text-slate-400">
                              <div class="flex items-center space-x-4">
                                <span>Semantic: {(rec.score_breakdown.semantic_score * 100).toFixed(0)}%</span>
                                <span>Genre: {(rec.score_breakdown.genre_affinity * 100).toFixed(0)}%</span>
                                <span>Popularity: {(rec.score_breakdown.popularity_prior * 100).toFixed(0)}%</span>
                                <span>Recency: {(rec.score_breakdown.recency_factor * 100).toFixed(0)}%</span>
                              </div>

                              <div class="flex items-center space-x-2">
                                <span>Was this helpful?</span>
                                <button 
                                  onClick={() => handleFeedback(rec.book.id, 5, true)}
                                  class={`px-2.5 py-1 rounded-lg border transition ${feedbackStatus[rec.book.id] === 5 ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700'}`}>
                                  👍 Yes
                                </button>
                                <button 
                                  onClick={() => handleFeedback(rec.book.id, 1, false)}
                                  class={`px-2.5 py-1 rounded-lg border transition ${feedbackStatus[rec.book.id] === 1 ? 'bg-rose-600 text-white border-rose-500' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700'}`}>
                                  👎 No
                                </button>
                              </div>
                            </div>

                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Profile Tab */}
            {activeTab === 'profile' && (
              <div class="max-w-2xl mx-auto glass-card rounded-2xl p-8 border border-slate-800 space-y-6">
                <h2 class="text-2xl font-bold">User Profile & Preferences</h2>
                <div class="space-y-4">
                  <div>
                    <label class="block text-sm text-slate-400 mb-1">Username</label>
                    <input type="text" value={userProfile.username} disabled class="w-full glass-input px-4 py-3 rounded-xl text-slate-400" />
                  </div>
                  <div>
                    <label class="block text-sm text-slate-400 mb-1">Favorite Genres (comma separated)</label>
                    <input 
                      type="text" 
                      value={userProfile.favorite_genres.join(', ')} 
                      onChange={(e) => setUserProfile({...userProfile, favorite_genres: e.target.value.split(',').map(s=>s.trim())})}
                      class="w-full glass-input px-4 py-3 rounded-xl text-white" 
                    />
                  </div>
                  <div>
                    <label class="block text-sm text-slate-400 mb-1">Preferred Mood</label>
                    <input 
                      type="text" 
                      value={userProfile.preferred_mood} 
                      onChange={(e) => setUserProfile({...userProfile, preferred_mood: e.target.value})}
                      class="w-full glass-input px-4 py-3 rounded-xl text-white" 
                    />
                  </div>
                  <button onClick={() => alert("Preferences updated!")} class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-xl text-white">Save Preferences</button>
                </div>
              </div>
            )}

            {/* Analytics Admin Tab */}
            {activeTab === 'analytics' && (
              <div class="space-y-6">
                <h2 class="text-2xl font-bold">System Metrics & Business Analytics</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div class="glass-card p-6 rounded-2xl border border-slate-800">
                    <div class="text-slate-400 text-sm">Active Microservices</div>
                    <div class="text-3xl font-bold text-emerald-400 mt-2">7 / 7 Healthy</div>
                    <div class="text-xs text-slate-500 mt-1">Gateway, User, Book, Retrieval, Ranking, LLM Worker, Analytics</div>
                  </div>
                  <div class="glass-card p-6 rounded-2xl border border-slate-800">
                    <div class="text-slate-400 text-sm">Avg Retrieval Latency</div>
                    <div class="text-3xl font-bold text-indigo-400 mt-2">14.2 ms</div>
                    <div class="text-xs text-slate-500 mt-1">Qdrant Vector DB Cosine Match</div>
                  </div>
                  <div class="glass-card p-6 rounded-2xl border border-slate-800">
                    <div class="text-slate-400 text-sm">Redis Queue Jobs Processed</div>
                    <div class="text-3xl font-bold text-violet-400 mt-2">100%</div>
                    <div class="text-xs text-slate-500 mt-1">Async LLM Worker Auto-scale Active</div>
                  </div>
                </div>

                <div class="glass-card p-6 rounded-2xl border border-slate-800">
                  <h3 class="text-lg font-bold mb-3">Live Prometheus Metrics Stream</h3>
                  <iframe src="http://localhost:8000/metrics" class="w-full h-80 bg-slate-900 rounded-xl border border-slate-800 text-xs font-mono text-emerald-400 p-4"></iframe>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
            BookWise AI Platform • Production-Grade Distributed AI Systems Architecture
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
