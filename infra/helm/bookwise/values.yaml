global:
  environment: production
  logLevel: INFO
  apiPrefix: /api/v1

image:
  repository: bookwise
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

replicaCount:
  apiGateway: 2
  userService: 2
  bookService: 2
  retrievalService: 2
  recommendationService: 2
  llmWorker: 2
  analyticsService: 1
  frontend: 2

resources:
  apiGateway:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  retrievalService:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 2Gi
  llmWorker:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  general:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  className: "nginx"
  host: bookwise.local

database:
  url: "postgresql://postgres:postgrespassword@postgres:5432/bookwise_db"

vectorDb:
  host: "qdrant"
  port: 6333

redis:
  host: "redis"
  port: 6379

llm:
  provider: "local"
  model: "gpt-4o-mini"
