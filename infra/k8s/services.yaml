apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bookwise
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: bookwise
  labels:
    app: user-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  selector:
    app: user-service
---
apiVersion: v1
kind: Service
metadata:
  name: book-service
  namespace: bookwise
  labels:
    app: book-service
spec:
  type: ClusterIP
