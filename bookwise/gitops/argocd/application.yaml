apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookwise-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/bookwise-ai/bookwise.git'
    targetRevision: HEAD
    path: infra/helm/bookwise
    helm:
      valueFiles:
        - ../../../gitops/environments/prod/values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bookwise
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
