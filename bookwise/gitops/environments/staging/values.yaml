global:
  environment: staging
  logLevel: INFO
  apiPrefix: /api/v1

replicaCount:
  apiGateway: 2
  userService: 2
  bookService: 2
  retrievalService: 2
  recommendationService: 2
  llmWorker: 2
  analyticsService: 1
  frontend: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

llm:
  provider: openai
  model: gpt-4o-mini
