apiVersion: v1
kind: ConfigMap
metadata:
  name: bookwise-config
  namespace: bookwise
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_PREFIX: "/api/v1"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  LLM_PROVIDER: "local"
  RETRIEVAL_SERVICE_URL: "http://retrieval-service.bookwise.svc.cluster.local:8003"
  RECOMMENDATION_SERVICE_URL: "http://recommendation-service.bookwise.svc.cluster.local:8004"
