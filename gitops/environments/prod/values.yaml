global:
  environment: production
  logLevel: WARNING
  apiPrefix: /api/v1

replicaCount:
  apiGateway: 3
  userService: 3
  bookService: 3
  retrievalService: 4
  recommendationService: 3
  llmWorker: 4
  analyticsService: 2
  frontend: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 70

resources:
  retrievalService:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  llmWorker:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

llm:
  provider: openai
  model: gpt-4o-mini
